server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Ficheiros com hash no nome: podem ficar em cache para sempre.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O service worker e o manifesto têm de ser sempre verificados, para as atualizações chegarem.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Páginas exportadas com trailingSlash (ex.: /medications/view/ -> /medications/view/index.html).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
